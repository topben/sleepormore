<!doctype html>
<!--
  Source for public/characters/{bear,bunny}.png, rendered from our game models.
  Open through the local Vite server, call portrait('male') / portrait('female'),
  then capture the 384px canvas with a transparent background at pixel ratio 1.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Character portrait renderer</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; background: transparent; }
      canvas { display: block; width: 384px; height: 384px; }
    </style>
  </head>
  <body>
    <script type="module">
      import * as THREE from 'three';
      import { Character, CharacterKit } from '/src/scene/character.ts';
      import { Tweens } from '/src/scene/tween.ts';

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;
      renderer.setPixelRatio(1);
      renderer.setSize(384, 384);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.setClearColor(0, 0);
      document.body.append(renderer.domElement);

      const scene = new THREE.Scene();
      scene.add(new THREE.HemisphereLight(0xfff3ef, 0x8b86b7, 1.7));
      const key = new THREE.DirectionalLight(0xffe4ca, 2.1);
      key.position.set(-2, 3, 4);
      scene.add(key);
      const fill = new THREE.DirectionalLight(0xc2d7ff, 0.9);
      fill.position.set(2, 1, 3);
      scene.add(fill);

      const camera = new THREE.OrthographicCamera(-0.42, 0.42, 0.42, -0.42, 0.01, 10);
      camera.position.set(0, 0.93, 2);
      camera.lookAt(0, 0.93, 0);
      const kit = new CharacterKit();
      const tweens = new Tweens();
      let character;

      window.portrait = (role) => {
        if (character) {
          scene.remove(character.root);
          character.dispose();
        }
        character = new Character(role, tweens, kit);
        character.cx.snap(0);
        character.cy.snap(0);
        character.cz.snap(0);
        character.cpitch.snap(0);
        character.update(0, 0);
        character.root.rotation.set(0, role === 'male' ? 0.12 : -0.12, 0);
        character.head.rotation.set(0.025, role === 'male' ? -0.08 : 0.08, role === 'male' ? -0.05 : 0.055);
        character.setExpression('smile');
        character.setBlush(1);
        scene.add(character.root);
        renderer.render(scene, camera);
      };

      window.portrait(new URLSearchParams(location.search).get('role') || 'male');
      window.portraitReady = true;
    </script>
  </body>
</html>
